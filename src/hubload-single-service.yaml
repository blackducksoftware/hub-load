version: '3'
services:
  hub-load:
    image: hubload-latest
    environment:
      # Scan type: SIGNATURE_SCAN, BINARY_SCAN, or CONTAINER_SCAN
      - SCAN_TYPE=SIGNATURE_SCAN
      
      # Black Duck configurations
      - BD_HUB_URL=https://dummy/
      - API_TOKEN=dummy==
      - API_TIMEOUT=300
      
      # Scan configuration
      - SYNCHRONOUS_SCANS=no
      - MAX_SCANS=3
      - MAX_CODELOCATIONS=1
      - MAX_VERSIONS=1
      - RANDOM_SCANS=no
      - FIXED_COMPONENTS=20
      - TEST_DURATION=1
      
      # Signature scan specific options
      - SNIPPETS=no
      - STRING_SEARCH=no
      
      # General options
      - DEBUG=no
      - INSECURE_CURL=no
      - FAIL_ON_SEVERITIES=NONE
      - DETECT_VERSION=LATEST
      
    command: /home/hub_load/submit_scans_fixed.sh
    deploy:
      restart_policy:
        condition: any
      mode: replicated
      replicas: 2
      update_config:
        delay: 4s

# Usage examples:
# 
# 1. Deploy signature scans (default):
#    docker stack deploy -c hubload-single-service.yaml hubload
# 
# 2. Deploy binary scans:
#    Change SCAN_TYPE to BINARY_SCAN and FIXED_COMPONENTS to 1
# 
# 3. Deploy container scans:
#    Change SCAN_TYPE to CONTAINER_SCAN and FIXED_COMPONENTS to 1
# 
# 4. Deploy with custom environment:
#    Override any environment variables as needed for your Black Duck instance
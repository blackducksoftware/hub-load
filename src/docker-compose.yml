version: '3.8'

services:
  hub-load-test:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: hub-load-memory-mapping
    
    # Required for GCS FUSE mounting
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    
    # Environment variables - customize these for your setup
    environment:
      - USE_MEMORY_MAPPING=yes
      - USE_GCS=yes
      - GCS_BUCKET=performance_test_bdios
      - GCS_PREFIX=SCASS/SCA_NON_BDIOS_BINARY_SM_MEDIUM/
      - GCS_MOUNT_POINT=/tmp/gcs-mount
      - GCS_CACHE_SIZE=10G
      - DEBUG=yes
      
      # GCS Authentication - choose one method:
      # Method 1: Service account key file (mount the key file)
      # - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcs-key.json
      
      # Method 2: Service account key as environment variable
      # - GCS_SERVICE_ACCOUNT_KEY=${GCS_SERVICE_ACCOUNT_KEY}
      
      # Black Duck configuration
      - BD_HUB_URL=${BD_HUB_URL:-https://your-hub-url.com}
      - API_TOKEN=${API_TOKEN:-your-api-token}
      - SCAN_TYPE=${SCAN_TYPE:-BINARY_SCAN}
      - MAX_SCANS=${MAX_SCANS:-10}
    
    # Volume mounts
    volumes:
      # Mount service account key file (uncomment and customize)
      # - /path/to/your/service-account-key.json:/tmp/gcs-key.json:ro
      
      # Mount local cache directory for better performance
      - gcs-cache:/tmp/gcs-cache
      
      # Mount results directory
      - ./results:/home/hub_load/results
    
    # Networks
    networks:
      - hub-load-network

  # Optional: Add a test runner service for development
  hub-load-test-runner:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: hub-load-test-runner
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    
    environment:
      - USE_MEMORY_MAPPING=yes
      - USE_GCS=no  # Disable GCS for local testing
      - DEBUG=yes
    
    volumes:
      - ./results:/home/hub_load/results
      - /tmp:/tmp  # For local test files
    
    command: ["./test_memory_mapping.sh"]
    profiles:
      - testing

networks:
  hub-load-network:
    driver: bridge

volumes:
  gcs-cache:
    driver: local
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-load-multi-scan-config
  namespace: hub-load
data:
  # Multi-Scan Configuration
  ENABLE_MULTI_SCAN: "yes"
  MULTI_SCAN_CONFIG: "BINARY_SCAN:40,SIGNATURE_SCAN:35,CONTAINER_SCAN:25"
  MULTI_GCS_CONFIG: "performance_test_bdios/SCASS/SCA_NON_BDIOS_BINARY_SM_MEDIUM:40,performance_test_bdios/SCASS/SCA_SIGNATURE_LARGE:35,performance_test_bdios/SCASS/SCA_CONTAINER_MIXED:25"
  
  # Repository-specific configurations
  REPO_1_BUCKET: "performance_test_bdios"
  REPO_1_PREFIX: "SCASS/SCA_NON_BDIOS_BINARY_SM_MEDIUM/"
  REPO_1_WEIGHT: "40"
  REPO_1_CACHE_SIZE: "15G"
  
  REPO_2_BUCKET: "performance_test_bdios"
  REPO_2_PREFIX: "SCASS/SCA_SIGNATURE_LARGE/"
  REPO_2_WEIGHT: "35"
  REPO_2_CACHE_SIZE: "20G"
  
  REPO_3_BUCKET: "performance_test_bdios"
  REPO_3_PREFIX: "SCASS/SCA_CONTAINER_MIXED/"
  REPO_3_WEIGHT: "25"
  REPO_3_CACHE_SIZE: "10G"
  
  # Scan type specific settings
  BINARY_SCAN_MAX_FILES: "1"
  SIGNATURE_SCAN_MAX_FILES: "400"
  CONTAINER_SCAN_MAX_FILES: "1"
  
  # Load testing parameters
  SCAN_DISTRIBUTION_RANDOM: "yes"
  REPO_SWITCHING_ENABLED: "yes"
  REPO_SWITCH_FREQUENCY: "10"  # Switch repository every N scans
  
  # Performance tuning
  PARALLEL_GCS_MOUNTS: "yes"
  GCS_CACHE_STRATEGY: "distributed"
  MEMORY_MAPPING_STRATEGY: "per_scan_type"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-load-multi-type-scanner
  namespace: hub-load
  labels:
    app: hub-load-multi-type
    component: scanner
spec:
  replicas: 5  # Start with 5 replicas for multi-type testing
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  
  selector:
    matchLabels:
      app: hub-load-multi-type
      component: scanner
  
  template:
    metadata:
      labels:
        app: hub-load-multi-type
        component: scanner
      annotations:
        checksum/config: "{{ multi-scan-config-checksum }}"
    spec:
      serviceAccountName: hub-load-sa
      
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      
      # Anti-affinity to distribute across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: hub-load-multi-type
              topologyKey: kubernetes.io/hostname
        # Prefer nodes with high memory for multi-type scanning
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values: ["high-memory", "compute-optimized"]
      
      containers:
      - name: hub-load-multi-scanner
        image: hub-load-test:latest
        imagePullPolicy: Always
        
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
        
        # Environment variables from multi-scan ConfigMap
        envFrom:
        - configMapRef:
            name: hub-load-config  # Base configuration
        - configMapRef:
            name: hub-load-multi-scan-config  # Multi-scan configuration
        
        env:
        - name: BD_HUB_URL
          valueFrom:
            secretKeyRef:
              name: hub-load-secrets
              key: BD_HUB_URL
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: hub-load-secrets
              key: API_TOKEN
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/tmp/gcs-credentials/key.json"
        
        # Multi-type specific configuration
        - name: USE_MEMORY_MAPPING
          value: "yes"
        - name: USE_GCS
          value: "yes"
        - name: ENABLE_MULTI_SCAN
          value: "yes"
        - name: DEBUG
          value: "no"
        - name: MAX_SCANS
          value: "50"  # Moderate load per pod
        - name: RANDOM_SCANS
          value: "yes"
        
        # Pod identification for distributed scanning
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        # Enhanced resource allocation for multi-type scanning
        resources:
          requests:
            memory: "6Gi"  # Increased for multiple GCS mounts
            cpu: "3000m"   # Higher CPU for parallel processing
            ephemeral-storage: "20Gi"
          limits:
            memory: "16Gi"
            cpu: "8000m"
            ephemeral-storage: "40Gi"
        
        volumeMounts:
        - name: gcs-credentials
          mountPath: /tmp/gcs-credentials
          readOnly: true
        # Multiple GCS cache volumes for different repositories
        - name: gcs-cache-repo1
          mountPath: /tmp/gcs-cache-repo1
        - name: gcs-cache-repo2
          mountPath: /tmp/gcs-cache-repo2
        - name: gcs-cache-repo3
          mountPath: /tmp/gcs-cache-repo3
        - name: results
          mountPath: /home/hub_load/results
          subPath: $(POD_NAME)
        - name: dev-fuse
          mountPath: /dev/fuse
        
        # Enhanced health checks for multi-type scanning
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              # Check if multi-type scanner is healthy
              if ps aux | grep -v grep | grep submit_scans_fixed.sh; then
                exit 0
              elif python3 /home/hub_load/multi_type_mmap_handler.py --source-dirs /tmp --dest-dir /tmp/test --info-only > /dev/null 2>&1; then
                exit 0
              else
                exit 1
              fi
          initialDelaySeconds: 120
          periodSeconds: 180
          timeoutSeconds: 60
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - /bin/bash 
            - -c
            - |
              # Check if all required components are ready
              [ -f /home/hub_load/submit_scans_fixed.sh ] && \
              [ -f /home/hub_load/multi_scan_config.sh ] && \
              [ -f /home/hub_load/multi_type_mmap_handler.py ] && \
              python3 -c "import json, random" > /dev/null 2>&1
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 15
          failureThreshold: 5
        
        # Startup probe for GCS mounting of multiple repositories
        startupProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              # Verify multi-type components are available
              [ -f /home/hub_load/multi_scan_config.sh ] && \
              python3 /home/hub_load/multi_type_mmap_handler.py --help > /dev/null 2>&1
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 12
        
        command: ["/home/hub_load/docker-entrypoint.sh"]
        args: ["./submit_scans_fixed.sh"]
      
      volumes:
      - name: gcs-credentials
        secret:
          secretName: gcs-service-account
      # Separate cache volumes for different repositories
      - name: gcs-cache-repo1
        persistentVolumeClaim:
          claimName: gcs-cache-repo1-pvc
      - name: gcs-cache-repo2
        persistentVolumeClaim:
          claimName: gcs-cache-repo2-pvc
      - name: gcs-cache-repo3
        persistentVolumeClaim:
          claimName: gcs-cache-repo3-pvc
      - name: results
        persistentVolumeClaim:
          claimName: hub-load-results-pvc
      - name: dev-fuse
        hostPath:
          path: /dev/fuse
          type: CharDevice
      
      nodeSelector:
        kubernetes.io/os: linux
      
      tolerations:
      - key: "hub-load"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "multi-scan"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      
      restartPolicy: Always
---
# Separate PVCs for different repository caches
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gcs-cache-repo1-pvc
  namespace: hub-load
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi  # Larger for binary files
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gcs-cache-repo2-pvc
  namespace: hub-load
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi  # Largest for signature files
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gcs-cache-repo3-pvc
  namespace: hub-load
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi  # Smaller for container images
  storageClassName: fast-ssd
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hub-load-multi-type-hpa
  namespace: hub-load
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hub-load-multi-type-scanner
  
  minReplicas: 5
  maxReplicas: 20  # Higher max for multi-type load
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65  # Lower threshold for multi-type
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 180  # Faster scaling for multi-type
      policies:
      - type: Percent
        value: 100  # Can double quickly
        periodSeconds: 60
      - type: Pods
        value: 3
        periodSeconds: 60
      selectPolicy: Max
    
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60
      selectPolicy: Min
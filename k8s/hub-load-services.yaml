apiVersion: v1
kind: Service
metadata:
  name: hub-load-service
  namespace: hub-load-testing
  labels:
    app: hub-load
    version: enhanced
spec:
  selector:
    app: hub-load
    version: enhancedIt
  ports:
    - name: monitoring
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hub-load-headless
  namespace: hub-load-testing
  labels:
    app: hub-load
    version: enhanced
spec:
  clusterIP: None
  selector:
    app: hub-load
    version: enhanced
  ports:
    - name: monitoring
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hub-load-hpa
  namespace: hub-load-testing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hub-load-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hub-load-pdb
  namespace: hub-load-testing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hub-load
      version: enhanced
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-load-sa
  namespace: hub-load-testing
  labels:
    app: hub-load
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-load-role
  namespace: hub-load-testing
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-load-rolebinding
  namespace: hub-load-testing
subjects:
- kind: ServiceAccount
  name: hub-load-sa
  namespace: hub-load-testing
roleRef:
  kind: Role
  name: hub-load-role
  apiGroup: rbac.authorization.k8s.io